<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- @SLOT:title --></title>
<script>
/* Set the theme before first paint: a saved choice, else the OS preference. */
(function () {
  var t = null;
  try { t = localStorage.getItem("walkthrough-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
/* Mermaid reads the --diagram-* values (and --ink, --accent, ...) through
   getComputedStyle, so keep every colour here a 6-digit hex. Token colours
   (--tk-*) pass WCAG AA on code, add, del and highlighted lines. */
:root {
  color-scheme: light;
  --bg: #f7f6f9; --panel: #ffffff; --ink: #1d1627; --ink-2: #584d6b; --ink-3: #8a7f9c;
  --accent: #6c5fc7; --accent-soft: #efedfb; --accent-ink: #4a3fa3; --on-accent: #ffffff;
  --line: #e4e0ee; --code-bg: #f4f2fa; --code-ink: #2b2440;
  --add-bg: #dcf5e3; --add-bar: #1f9d55; --del-bg: #fde4e4; --del-bar: #d64545;
  --note-bg: #eef4ff; --note-bar: #3b82c4; --warn-bg: #fdf3e0; --warn-bar: #d9930d;
  --key-bg: #f0ebfd; --key-bar: #6c5fc7;
  --tk-kw: #5b3cc4; --tk-str: #0b5e86; --tk-num: #9a4a00; --tk-fn: #9c2a7a;
  --tk-type: #0d6b5a; --tk-cmt: #6b6280; --tk-meta: #7a5a00;
  --diagram-bg: #fbfafc; --diagram-node: #efedfb; --diagram-alt: #f4f2fa; --diagram-current: #d9d2fb;
  --sc-breaks: #e72e3b; --sc-breaks-bg: #ffecee; --sc-breaks-ink: #b3202c;
  --sc-may: #e8730c; --sc-may-bg: #fff3e6; --sc-may-ink: #9a4a00; --sc-path: #1680f3; --sc-repeats: #9b35d6;
  --sc-blue: #c3e0ff; --sc-orange: #f0d3bf; --sc-purple: #e3d5ff; --sc-yellow: #f0dcbf;
  --sc-teal: #bfe3df; --sc-tan: #e5d9ce; --sc-pink: #ffcbe6;
  --shadow: 0 1px 3px rgba(29,22,39,.08), 0 4px 14px rgba(29,22,39,.05);
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #16121f; --panel: #1e1830; --ink: #ece8f5; --ink-2: #b6aecb; --ink-3: #7d7396;
  --accent: #9d8fef; --accent-soft: #2a2244; --accent-ink: #b6a8ff; --on-accent: #16121f;
  --line: #322a4d; --code-bg: #241d3a; --code-ink: #e2dcf2;
  --add-bg: #143a24; --add-bar: #34c774; --del-bg: #441f24; --del-bar: #ef6a6a;
  --note-bg: #16283f; --note-bar: #58a6e8; --warn-bg: #3a2c12; --warn-bar: #e8b04b;
  --key-bg: #2a2244; --key-bar: #9d8fef;
  --tk-kw: #c4b5ff; --tk-str: #8ccff7; --tk-num: #ffb470; --tk-fn: #f39bd3;
  --tk-type: #6fdac2; --tk-cmt: #a197bb; --tk-meta: #e7c36a;
  --diagram-bg: #1a1529; --diagram-node: #2a2244; --diagram-alt: #241d3a; --diagram-current: #43367a;
  --sc-breaks: #ef4b55; --sc-breaks-bg: #3a1f24; --sc-breaks-ink: #ff8a88;
  --sc-may: #e8892e; --sc-may-bg: #3a2a16; --sc-may-ink: #ffb470; --sc-path: #58a6e8; --sc-repeats: #c27cf0;
  --sc-blue: #1b3857; --sc-orange: #573117; --sc-purple: #3c2e57; --sc-yellow: #573d17;
  --sc-teal: #174641; --sc-tan: #3d3127; --sc-pink: #57233e;
  --shadow: 0 1px 3px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
:root { --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.62 var(--ui-font);
}
/* ---------- layout ---------- */
#sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: 292px; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--line); padding: 22px 18px 60px;
}
#sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); margin: 18px 0 8px; }
#sidebar a { display: block; color: var(--ink-2); text-decoration: none; font-size: 13.5px; padding: 4px 10px; border-radius: 7px; border-left: 3px solid transparent; }
#sidebar a:hover { background: var(--accent-soft); color: var(--accent-ink); }
#sidebar a.active { color: var(--accent-ink); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
#sidebar .brand { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
#sidebar .sub { font-size: 12px; color: var(--ink-3); margin-bottom: 14px; }
main { margin-left: 292px; padding: 40px 48px 140px; max-width: 1240px; }
@media (max-width: 1060px) { #sidebar { display: none; } main { margin-left: 0; padding: 24px 18px 120px; } }
section.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 30px 34px; margin: 0 0 34px; box-shadow: var(--shadow); scroll-margin-top: 24px;
}
section.card > h2 { margin-top: 0; font-size: 24px; letter-spacing: -.01em; }
h3 { font-size: 18px; margin: 30px 0 10px; }
h3[id], h2[id] { scroll-margin-top: 20px; }
h4 { font-size: 15.5px; margin: 22px 0 8px; }
p { margin: 10px 0; }
a { color: var(--accent-ink); }
code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; background: var(--code-bg); padding: .12em .38em; border-radius: 5px; }
/* Long identifiers in prose would widen the page on a phone. `anywhere` would
   also break names mid-word inside tables; `break-word` does not. */
p code, li code, td code, dd code, dt, .caption code { overflow-wrap: break-word; }
/* ---------- hero ---------- */
#hero { background: linear-gradient(135deg, #241d3a, #4a3fa3 55%, #6c5fc7); color: #fff; border: none; }
#hero h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -.02em; }
#hero p.sub { color: #d8d2f2; font-size: 16px; margin: 0 0 18px; }
#hero .meta { display: flex; flex-wrap: wrap; gap: 8px; }
#hero .meta span, #hero .meta a { background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-family: ui-monospace, Menlo, monospace; }
#hero .meta a { color: #fff; text-decoration: none; }
#hero .meta a::after { content: " ↗"; opacity: .75; }
#hero .meta a:hover { background: rgba(255,255,255,.24); }
/* ---------- pills, stat bars ---------- */
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; vertical-align: middle; }
.pill.file { background: var(--accent-soft); color: var(--accent-ink); font-family: ui-monospace, Menlo, monospace; font-weight: 500; }
.pill.new { background: var(--add-bg); color: var(--add-bar); }
.pill.changed { background: var(--warn-bg); color: var(--warn-bar); }
.statbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; max-width: 420px; }
.statbar .a { background: var(--add-bar); } .statbar .d { background: var(--del-bar); }
.statlbl { font-size: 12.5px; color: var(--ink-3); font-family: ui-monospace, Menlo, monospace; }
/* ---------- callouts ---------- */
.callout { border-radius: 10px; padding: 14px 18px 14px 16px; margin: 16px 0; border-left: 4px solid; font-size: 14.5px; }
.callout p:first-child { margin-top: 0; } .callout p:last-child { margin-bottom: 0; }
.callout .t { font-weight: 700; display: block; margin-bottom: 3px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.note { background: var(--note-bg); border-color: var(--note-bar); } .note .t { color: var(--note-bar); }
.warn { background: var(--warn-bg); border-color: var(--warn-bar); } .warn .t { color: var(--warn-bar); }
.key  { background: var(--key-bg);  border-color: var(--key-bar); }  .key .t { color: var(--key-bar); }
/* ---------- code ---------- */
.codewrap { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 14px 0; background: var(--code-bg); }
/* The path sits left; the ref label and the source links (added by the JS) sit right, and wrap on a phone. */
.codehead { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; background: var(--accent-soft); padding: 6px 14px; font-size: 12.5px; font-family: ui-monospace, Menlo, monospace; color: var(--accent-ink); }
.codehead > :first-child { margin-right: auto; overflow-wrap: anywhere; }
.codehead .srclinks { display: inline-flex; gap: 12px; white-space: nowrap; }
.codehead a, .ln a { color: inherit; text-underline-offset: 2px; }
.walker > .codehead { grid-column: 1 / -1; border-bottom: 1px solid var(--line); }
.codewrap pre { margin: 0; padding: 14px 0; overflow-x: auto; font-size: 13px; line-height: 1.55; }
.codewrap pre code, .walker .wcode pre code { background: none; padding: 0; font-size: inherit; color: var(--code-ink); display: block; }
/* .cl lines are blocks, so the source newline between two lines would render
   as an extra blank line: collapse it. min-height keeps empty lines visible. */
pre code:has(> .cl) { white-space: normal; }
.codewrap pre code:not(:has(> .cl)) { padding: 0 16px 0 17px; }
.cl { display: block; padding: 0 16px 0 14px; border-left: 3px solid transparent; white-space: pre; min-height: 1lh; }
.cl.add { background: var(--add-bg); border-left-color: var(--add-bar); }
.cl.del { background: var(--del-bg); border-left-color: var(--del-bar); }
.cl.hl  { background: var(--accent-soft); border-left-color: var(--accent); }
.cl.dim { opacity: .62; }
/* Line numbers: the JS sets data-n from data-start (or data-old-start and
   data-new-start for a unified diff) on the <code>. The number is generated
   content, so it is not copied with the code. A .gap line (an elision marker)
   gets no number but keeps the gutter, so the code stays aligned. */
.cl[data-n]::before, pre code:has(> .cl[data-n]) > .cl:not([data-n])::before {
  display: inline-block; min-width: var(--ln-w, 3ch); margin: 0 12px 0 -6px; text-align: right;
  color: var(--ink-3); opacity: .75; user-select: none; -webkit-user-select: none;
}
.cl[data-n]::before { content: attr(data-n); }
pre code:has(> .cl[data-n]) > .cl:not([data-n])::before { content: ""; }
.cl.gap { color: var(--ink-3); font-style: italic; }
/* Line-keyed notes under a quoted chunk: <ul class="lbl"><li><span class="ln">12-18</span> ...</li></ul> */
.lbl { list-style: none; padding-left: 0; margin: 8px 0 18px; }
.lbl li { margin: 6px 0; padding-left: 92px; text-indent: -92px; }
.lbl li > .ln { display: inline-block; width: 84px; text-indent: 0; margin-right: 8px; font: 600 12.5px ui-monospace, Menlo, monospace; color: var(--accent-ink); }
@media (max-width: 600px) { .lbl li { padding-left: 0; text-indent: 0; } .lbl li > .ln { display: block; width: auto; } }
/* ---------- syntax tokens: highlight.js classes and hand-marked .kw/.str/.cmt share one palette ---------- */
.hljs-keyword, .hljs-selector-tag, .hljs-name, .hljs-variable.language_, .hljs-doctag, .kw { color: var(--tk-kw); }
.hljs-keyword, .kw { font-weight: 600; }
.hljs-string, .hljs-regexp, .hljs-char.escape_, .hljs-meta .hljs-string, .hljs-template-tag, .str { color: var(--tk-str); }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet, .hljs-variable.constant_, .hljs-link { color: var(--tk-num); }
.hljs-title, .hljs-section, .hljs-selector-id, .hljs-selector-class { color: var(--tk-fn); }
.hljs-type, .hljs-built_in, .hljs-title.class_, .hljs-attr, .hljs-attribute, .hljs-selector-attr, .hljs-selector-pseudo { color: var(--tk-type); }
.hljs-meta, .hljs-template-variable { color: var(--tk-meta); }
.hljs-comment, .hljs-quote, .cmt { color: var(--tk-cmt); font-style: italic; }
.hljs-subst { color: var(--code-ink); }
.hljs-addition { background: var(--add-bg); } .hljs-deletion { background: var(--del-bg); }
.hljs-emphasis { font-style: italic; } .hljs-strong { font-weight: 700; }
/* ---------- before/after tabs ---------- */
.batabs { display: inline-flex; background: var(--accent-soft); border-radius: 9px; padding: 3px; gap: 3px; margin: 6px 0; }
.batabs button { border: none; background: transparent; color: var(--accent-ink); font: 600 12.5px/1 var(--ui-font); padding: 7px 16px; border-radius: 7px; cursor: pointer; }
.batabs button.on { background: var(--panel); box-shadow: var(--shadow); }
.bapane { display: none; } .bapane.on { display: block; }
/* ---------- details ---------- */
details { border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; background: var(--panel); }
details > summary { cursor: pointer; padding: 10px 16px; font-weight: 600; font-size: 14px; color: var(--accent-ink); list-style: none; }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
details > .body { padding: 2px 18px 14px; border-top: 1px dashed var(--line); }
/* ---------- tables ---------- */
table.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 14px 0; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 7px 10px; border-bottom: 2px solid var(--line); }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:nth-child(even) td { background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }
.tbl td code { font-size: 12px; }
/* ---------- mermaid: themed from the --diagram-* tokens, re-rendered on theme change ---------- */
.mermaid { background: var(--diagram-bg); border: 1px solid var(--line); border-radius: 10px; padding: 18px 10px; margin: 14px 0; text-align: center; overflow-x: auto; }
/* `class NodeId current` in a flowchart: theme-aware highlight (mermaid's own rules use an id selector, hence !important) */
.mermaid .node.current .label-container, .mermaid .node.current > rect, .mermaid .node.current > polygon,
.mermaid .node.current > circle, .mermaid .node.current > path { fill: var(--diagram-current) !important; stroke: var(--accent) !important; stroke-width: 2.5px !important; }
.mermaid .node.current .nodeLabel { font-weight: 700; }
.mermaid-fallback { font-size: 12.5px; color: var(--ink-3); text-align: left; }
/* ---------- statecharts (chart.mmd from the statechart skill, in a .mermaid[data-statechart]) ----------
   The JS drops the chart's own `classDef breaks/mayBreak` lines (fixed light colours);
   these rules colour each class in both themes. Group colours first, then the marks. */
.mermaid .node.blue > rect { fill: var(--sc-blue) !important; }
.mermaid .node.orange > rect { fill: var(--sc-orange) !important; }
.mermaid .node.purple > rect { fill: var(--sc-purple) !important; }
.mermaid .node.yellow > rect { fill: var(--sc-yellow) !important; }
.mermaid .node.teal > rect { fill: var(--sc-teal) !important; }
.mermaid .node.tan > rect { fill: var(--sc-tan) !important; }
.mermaid .node.pink > rect { fill: var(--sc-pink) !important; }
.mermaid .node.breaks > rect { fill: var(--sc-breaks-bg) !important; stroke: var(--sc-breaks) !important; stroke-width: 2.5px !important; }
.mermaid .node.breaks .nodeLabel { color: var(--sc-breaks-ink) !important; }
.mermaid .node.mayBreak > rect { fill: var(--sc-may-bg) !important; stroke: var(--sc-may) !important; stroke-width: 2.5px !important; }
.mermaid .node.mayBreak .nodeLabel { color: var(--sc-may-ink) !important; }
.mermaid .node.bugPath > rect { stroke: var(--sc-path) !important; stroke-width: 2.5px !important; }
.mermaid .node.repeats > rect { stroke: var(--sc-repeats) !important; stroke-width: 2.5px !important; stroke-dasharray: 6 3; }
/* A chart walker step: the state the run is in now, and the states it has passed.
   No bold labels here: mermaid sizes each box for its text at normal weight. */
.mermaid g.cw-seen > rect { stroke: var(--accent) !important; stroke-width: 2.5px !important; }
.mermaid g.cw-on > rect { fill: var(--diagram-current) !important; stroke: var(--accent) !important; stroke-width: 4px !important; stroke-dasharray: none; }
/* A chart walker stacks: the chart takes the card's full width, and its pane is
   the only scroller, so the JS can scroll the current state into view. */
.walker[data-chartwalk] { grid-template-columns: minmax(0, 1fr); }
.walker .wchart { background: var(--diagram-bg); border-bottom: 1px solid var(--line); overflow: auto; max-height: 62vh; }
.walker .wchart .mermaid { border: 0; border-radius: 0; margin: 0; overflow: visible; text-align: left; }
/* Status chips and rule cards: one card for each rule that the model checks. */
.chip { display: inline-block; border: 1px solid var(--line); border-left-width: 4px; border-radius: 999px; padding: 1px 10px; font: 600 12px var(--ui-font); color: var(--ink); background: var(--panel); white-space: nowrap; vertical-align: middle; }
.chip.breaks { border-color: var(--sc-breaks); background: var(--sc-breaks-bg); }
.chip.may { border-color: var(--sc-may); background: var(--sc-may-bg); }
.chip.holds { border-color: var(--add-bar); background: var(--add-bg); }
.chip.repro { border-color: var(--note-bar); background: var(--note-bg); }
.chip.model { border-color: var(--warn-bar); background: var(--warn-bg); }
.rulecard { border: 1px solid var(--line); border-left: 5px solid var(--sc-breaks); border-radius: 12px; padding: 16px 20px; margin: 20px 0; background: var(--panel); }
.rulecard.holds { border-left-color: var(--add-bar); }
.rulecard .rchead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.rulecard .rchead h3 { margin: 0 auto 0 0; font-size: 18px; overflow-wrap: anywhere; }
.rulecard .rcrule { font-size: 16px; margin: 10px 0 4px; }
.rulecard h4 { margin: 18px 0 6px; }
/* ---------- walker ---------- */
.walker { display: grid; grid-template-columns: minmax(0,7fr) minmax(0,5fr); gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 16px 0; }
/* minmax(0, 1fr), not 1fr: a plain 1fr column grows to the widest code line and clips the step text on a phone. */
@media (max-width: 900px) { .walker { grid-template-columns: minmax(0, 1fr); } }
/* A long walker scrolls its own code pane; the JS scrolls the highlighted lines into view at each step. */
.walker .wcode { background: var(--code-bg); border-right: 1px solid var(--line); overflow: auto; max-height: 72vh; }
.walker .wcode pre { margin: 0; padding: 12px 0; font-size: 12.5px; line-height: 1.5; overflow-x: auto; }
.walker .wside { background: var(--panel); padding: 16px 20px; display: flex; flex-direction: column; }
.walker .wstep { display: none; } .walker .wstep.on { display: block; }
.walker .wstep h4 { margin-top: 0; }
.walker .wctl { margin-top: auto; padding-top: 14px; display: flex; align-items: center; gap: 10px; }
.walker .wctl button { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 7px 15px; font: 600 13px var(--ui-font); cursor: pointer; }
.walker .wctl button.sec { background: transparent; color: var(--accent-ink); }
.walker .wctl button:disabled { opacity: .35; cursor: default; }
.walker .wdots { display: flex; gap: 5px; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; justify-content: center; }
.walker .wdots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.walker .wdots i.on { background: var(--accent); }
/* ---------- glossary ---------- */
dfn { font-style: normal; border-bottom: 1.5px dotted var(--accent); cursor: help; }
.glos dt { font-weight: 700; font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; margin-top: 12px; }
.glos dd { margin: 2px 0 0 0; font-size: 14px; color: var(--ink-2); }
/* ---------- misc ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; margin: 10px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border-left: 3px solid; }
.legend .l-add { background: var(--add-bg); border-left-color: var(--add-bar); }
.legend .l-del { background: var(--del-bg); border-left-color: var(--del-bar); }
.legend .l-hl  { background: var(--accent-soft); border-left-color: var(--accent); }
.big { font-size: 17.5px; }
.kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; font-size: 12px; background: var(--panel); }
#themeBtn { position: fixed; top: 14px; right: 16px; z-index: 50; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); border-radius: 999px; padding: 7px 14px; font: 600 12.5px var(--ui-font); cursor: pointer; box-shadow: var(--shadow); }
.sig { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--code-bg); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; overflow-x: auto; white-space: pre; margin: 8px 0; }
</style>
</head>
<body>
<button id="themeBtn" type="button">◐ theme</button>
<!-- @SLOT:source — when the quoted commits are on GitHub, this JSON block says
where they live, and the JS builds every source link from it. Keep it the one
copy of the SHAs that the links use:
<script type="application/json" id="walkthrough-source">
{"repo": "https://github.com/OWNER/REPO", "pr": 1234,
 "base": "<full merge-base SHA>", "head": "<full head SHA>",
 "files": ["every/path/the/pr/changes.py"]}
</script>
"pr" and "files" are only for a PR, and "base" only for a change. Leave the
block out when a commit is not on GitHub: its links would 404. -->
<nav id="sidebar">
  <div class="brand"><!-- @SLOT:brand --></div>
  <div class="sub"><!-- @SLOT:brand-sub --></div>
  <!-- @SLOT:sidebar — groups like:
  <h2>Section group</h2>
  <a href="#anchor-id">Section title</a>
  Every href must match an id on a section.card or h3 in <main>. -->
</nav>
<main>
<!-- @SLOT:sections — author each section as:

<section class="card" id="anchor-id">
  <h2>Section title</h2>
  <p>The bottom line: the point of the section in one to three plain sentences.</p>
  ...code, diagrams, detail...
</section>

Prose follows the SKILL.md prose rules: understanding over economy, bottom
line up front, ASD-STE100 wording.

COMPONENT PATTERNS (all wired by the JS below):

1) Hero. For a PR, the first chip links to the PR and each SHA chip to its commit:
<section class="card" id="hero">
  <h1>Title</h1><p class="sub">Subtitle</p>
  <div class="meta"><a href="https://github.com/OWNER/REPO/pull/1234">PR #1234</a>
    <a href="https://github.com/OWNER/REPO/commit/FULLSHA">head abc1234</a><span>chip</span></div>
</section>

2) Before/after toggle. A pane belongs to the group whose button has the same
key; panes are found under the tabs' parent element, so keep keys unique on the page:
<div class="batabs" data-tabs="grp">
  <button class="on" data-p="grp-a">Before (base &lt;sha&gt;)</button>
  <button data-p="grp-b">After (tip &lt;sha&gt;)</button>
</div>
<div class="bapane on" data-pane="grp-a">...before code...</div>
<div class="bapane" data-pane="grp-b">...after code...</div>

3) Code with line numbers, diff colors and syntax highlighting (escape &lt; as &amp;lt;).
Line numbers are on by default: put the file's first quoted line number in
data-start. A .gap line marks an elision; its data-start is where the count
restarts. For a unified diff use data-old-start and data-new-start (from the
hunk header "@@ -a,b +c,d @@"): removed lines show old numbers, other lines new ones.
data-path (the path from the repository root) gives the block its source links,
when the page has the source block: "L40-L57" opens those lines at the pinned
commit, and "PR #1234" opens them in the PR's Files changed view when the PR
changes the file. Put data-ref="base" on a Before pane: its links then use the
base commit and the diff's left side. A unified diff links its new-side lines,
or its old-side lines when every line is removed.
<div class="codewrap" data-path="path/to/file.py"><div class="codehead"><span>path/to/file.py</span><span>tip &lt;sha&gt;</span></div>
<pre><code class="language-python" data-start="40"><span class="cl">context line</span>
<span class="cl hl">emphasized line (NOT a diff)</span>
<span class="cl gap" data-start="57">    # ... lines 42-56 elided ...</span>
<span class="cl">line 57</span></code></pre></div>

<div class="codewrap" data-path="path/to/file.py"><div class="codehead"><span>path/to/file.py</span><span>diff</span></div>
<pre><code class="language-python" data-old-start="12" data-new-start="12"><span class="cl">context line</span>
<span class="cl del">removed line (real diff only)</span>
<span class="cl add">added line (real diff only)</span></code></pre></div>
`language-<name>` takes any highlight.js name or alias (python, ts, tsx, go, rust,
sql, yaml, bash, json, ...); names outside the common bundle load on demand.
The whole block is highlighted as one text, then split back onto the .cl lines,
so add/del/hl/dim classes and walker data-l attributes survive. Lines stay plain
text: no "+"/"-" prefixes (the classes carry the diff). A block with no
language-* class, or with any element inside a .cl line, is left exactly as
written; hand-mark such a block with <span class="kw|str|cmt">. The same class
works on a .sig signature box.

4) Callouts:
<div class="callout key"><span class="t">Title</span><p>...</p></div>   (.key | .note | .warn)

5) Step-through walker (steps own line ranges via data-lines; lines carry data-l).
With data-path, the JS adds a header row with the path and the source links:
<div class="walker" data-walker data-path="path/to/file.py">
  <div class="wcode"><pre><code class="language-python" data-start="1">
<span class="cl" data-l="1">line one</span>
<span class="cl" data-l="2">line two</span></code></pre></div>
  <div class="wside">
    <div class="wstep on" data-lines="1"><h4>1 · First thing</h4><p>...</p></div>
    <div class="wstep" data-lines="2"><h4>2 · Second thing</h4><p>...</p></div>
    <div class="wctl">
      <button class="sec" data-wprev>← prev</button><div class="wdots"></div><button data-wnext>next →</button>
    </div>
  </div>
</div>

6) Mermaid (renders via CDN; degrades to readable source offline).
This example uses ==> (thick arrows) only because the usual arrow would end
this HTML comment; write normal arrows in real diagrams:
<div class="mermaid">
flowchart LR
    A["part 1"] ==> B["part 2"] ==> C["part 3"]
    class B current
</div>
Colours come from the page theme and re-render on toggle, so do not hard-code
fills (`style X fill:#...`, classDef colours): they break in one theme.
`class NodeId current` highlights a flowchart node in both themes.

7) Glossary terms: <dfn title="short definition">term</dfn> (click jumps to .glos)
<dl class="glos"><dt>term</dt><dd>definition</dd></dl>

8) Collapsible deep-dive:
<details><summary>Title</summary><div class="body">...</div></details>

9) Line-keyed notes under a quoted chunk (a file tour). Each note names the
lines it explains and links to the section that teaches the mechanism. With the
source block, each .ln range links to its lines on GitHub: the file comes from
the nearest earlier sibling with data-path, or from an ancestor with data-path
(put one on a table of test ranges):
<ul class="lbl">
  <li><span class="ln">40-44</span> The guard returns early when ... (<a href="#anchor-id">details</a>)</li>
</ul>

10) Statechart: paste chart.mmd from the statechart command, unchanged, into a
.mermaid with data-statechart (escape < as &amp;lt;). The JS drops the chart's
classDef lines for breaks and mayBreak, and the page colours the classes breaks,
mayBreak, bugPath, repeats and the group colours in both themes. Mermaid 10 does not
wrap labels, so the JS also breaks each state and arrow label into lines of at most
26 characters:
<div class="mermaid" data-statechart>...chart.mmd, verbatim...</div>

11) Chart walker: a statechart beside steps. Each step's data-node is the id of
a state in chart.mmd (s0, s3); the step highlights that state and marks the
states of the earlier steps. Walk the happy path, then each bug path in the
report's numbering:
<div class="walker" data-chartwalk>
  <div class="wchart"><div class="mermaid" data-statechart>...chart.mmd...</div></div>
  <div class="wside">
    <div class="wstep on" data-node="s0"><h4>0 · Starting TLC</h4><p>...</p></div>
    <div class="wstep" data-node="s3"><h4>1 · the command starts TLC</h4><p>...</p></div>
    <div class="wctl">
      <button class="sec" data-wprev>← prev</button><div class="wdots"></div><button data-wnext>next →</button>
    </div>
  </div>
</div>

12) Rule card: one for each rule that the model checks. The class is breaks or
holds; the chips say what TLC found and whether the path ran on the real code:
<div class="rulecard breaks" id="rule-name">
  <div class="rchead"><h3>RuleName</h3><span class="chip breaks">breaks</span>
    <span class="chip repro">reproduced</span></div>          (or chip model: model only)
  <p class="rcrule">The rule, in the reader's words.</p>
  <div class="codewrap"><div class="codehead"><span>Model.tla</span></div>
  <pre><code class="language-plaintext">RuleName == ...</code></pre></div>
  <h4>What breaks it</h4> ...a chart walker over the shortest path...
  <h4>Why</h4> ...the one step where the rule fails, and the code that takes it...
  <h4>How likely, and what it costs</h4> ...
  <h4>Fixes</h4> ...a before/after toggle with one pane for each fix:
  <div class="batabs" data-tabs="fix-name">
    <button class="on" data-p="fix-name-a">Proposed: ...</button><button data-p="fix-name-b">Alternative: ...</button></div>
  <div class="bapane on" data-pane="fix-name-a"><span class="chip holds">TLC: every rule holds</span> ...</div>
  <div class="bapane" data-pane="fix-name-b"><span class="chip may">TLC: RuleName still breaks</span> ...</div>
</div>

13) Design comparison: a before/after toggle with one statechart for each design,
each followed by a table of its numbers from report.md (states, steps, chart
states, arrows, the rules that hold).
-->
</main>
<script>
(function () {
  "use strict";
  /* ---------- theme (initial value is set by the script in <head>) ---------- */
  var root = document.documentElement;
  var themeBtn = document.getElementById("themeBtn");
  var KEY = "walkthrough-theme";
  function savedTheme() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function labelButton() {
    var dark = root.getAttribute("data-theme") === "dark";
    themeBtn.textContent = dark ? "☀ light" : "☾ dark";
    themeBtn.title = dark ? "Switch to light theme" : "Switch to dark theme";
  }
  function setTheme(t) {
    root.setAttribute("data-theme", t);
    labelButton();
    // The mermaid module re-renders diagrams on this event.
    document.dispatchEvent(new CustomEvent("walkthrough:theme", { detail: { theme: t } }));
  }
  labelButton();
  themeBtn.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    try { localStorage.setItem(KEY, next); } catch (e) {}
    setTheme(next);
  });
  // Follow OS changes until the reader picks a theme with the button.
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  if (mq && mq.addEventListener) {
    mq.addEventListener("change", function (ev) {
      if (!savedTheme()) setTheme(ev.matches ? "dark" : "light");
    });
  }
  /* ---------- before/after tabs ---------- */
  // A pane belongs to a tab group when its data-pane equals one of the group's
  // button keys. Panes are looked up under the tabs' parent element, so two
  // groups can share a parent as long as their keys differ.
  document.querySelectorAll(".batabs").forEach(function (tabs) {
    var buttons = Array.prototype.slice.call(tabs.querySelectorAll("button[data-p]"));
    var keys = buttons.map(function (b) { return b.getAttribute("data-p"); });
    tabs.addEventListener("click", function (ev) {
      var btn = ev.target.closest("button[data-p]");
      if (!btn) return;
      var key = btn.getAttribute("data-p");
      buttons.forEach(function (b) { b.classList.toggle("on", b === btn); });
      tabs.parentElement.querySelectorAll(".bapane[data-pane]").forEach(function (pane) {
        var k = pane.getAttribute("data-pane");
        if (keys.indexOf(k) !== -1) pane.classList.toggle("on", k === key);
      });
    });
  });
  /* ---------- line numbers ---------- */
  // <code data-start="N">: lines are numbered N, N+1, ... A .cl.gap line (an
  // elision marker) has no number; its own data-start restarts the count after it.
  // <code data-old-start="A" data-new-start="B">: a unified diff. A .del line shows
  // the old number, an .add line the new number, and a context line the new number
  // (it advances both). A .gap line can restart both counts, like a hunk header.
  // A line with its own data-n keeps it.
  document.querySelectorAll("pre > code[data-start], pre > code[data-new-start]").forEach(function (code) {
    var diff = code.hasAttribute("data-new-start");
    var n = parseInt(code.getAttribute(diff ? "data-new-start" : "data-start"), 10);
    var o = diff ? parseInt(code.getAttribute("data-old-start"), 10) : NaN;
    var widest = 1;
    code.querySelectorAll(":scope > .cl").forEach(function (cl) {
      if (cl.classList.contains("gap")) {
        if (cl.hasAttribute(diff ? "data-new-start" : "data-start")) n = parseInt(cl.getAttribute(diff ? "data-new-start" : "data-start"), 10);
        if (diff && cl.hasAttribute("data-old-start")) o = parseInt(cl.getAttribute("data-old-start"), 10);
        return;
      }
      var shown;
      if (diff && cl.classList.contains("del")) { shown = o; o += 1; }
      else if (diff && cl.classList.contains("add")) { shown = n; n += 1; }
      else { shown = n; n += 1; o += 1; }
      if (!cl.hasAttribute("data-n")) cl.setAttribute("data-n", String(shown));
      widest = Math.max(widest, cl.getAttribute("data-n").length);
    });
    code.style.setProperty("--ln-w", Math.max(3, widest) + "ch");
  });
  /* ---------- source links ---------- */
  // #walkthrough-source names the GitHub repository and the pinned commits,
  // and for a PR its number and changed files. A block with data-path links
  // to its numbered lines at the pinned commit, and to the same lines in the
  // PR's Files changed view when the PR changes the file. A .ln range links
  // to its lines in the file of its block.
  var source = null;
  try { source = JSON.parse(document.getElementById("walkthrough-source").textContent); } catch (e) {}
  if (source && source.repo && source.head) {
    var repo = String(source.repo).replace(/\/+$/, "");
    var changed = {};
    (source.files || []).forEach(function (p) { changed[p] = true; });
    var lineRange = function (side, a, b) { return side + a + (b > a ? "-" + side + b : ""); };
    // ?plain=1: GitHub renders Markdown and similar files, and that view has no line anchors.
    var blobUrl = function (sha, path, a, b) {
      return repo + "/blob/" + sha + "/" + path.split("/").map(encodeURIComponent).join("/") +
        "?plain=1#" + lineRange("L", a, b);
    };
    // The Files changed view names each file's anchor by the SHA-256 of its path.
    var sha256 = function (text) {
      if (!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.reject(new Error("no crypto.subtle"));
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
      });
    };
    var makeLink = function (href, text, title) {
      var a = document.createElement("a");
      a.href = href; a.textContent = text; a.title = title; a.target = "_blank"; a.rel = "noopener";
      return a;
    };
    var shaOf = function (host) { return host.getAttribute("data-ref") === "base" ? source.base : source.head; };
    // The commit, the diff side, and the first and last line that a block shows.
    var shownLines = function (host) {
      var code = host.querySelector("pre > code");
      if (!code) return null;
      var lines = Array.prototype.slice.call(code.querySelectorAll(":scope > .cl[data-n]"));
      var diff = code.hasAttribute("data-new-start");
      var base = !diff && host.getAttribute("data-ref") === "base";
      var picked = lines.filter(function (cl) { return !diff || !cl.classList.contains("del"); });
      if (diff && !picked.length) { base = true; picked = lines; }
      var nums = picked.map(function (cl) { return parseInt(cl.getAttribute("data-n"), 10); })
        .filter(function (x) { return isFinite(x); });
      if (!nums.length) return null;
      return { base: base, a: Math.min.apply(null, nums), b: Math.max.apply(null, nums) };
    };
    document.querySelectorAll("[data-path]").forEach(function (host) {
      var path = host.getAttribute("data-path");
      var s = shownLines(host);
      var sha = s && (s.base ? source.base : source.head);
      if (!sha) return;
      var head = host.querySelector(":scope > .codehead");
      if (!head) {
        head = document.createElement("div");
        head.className = "codehead";
        var name = document.createElement("span");
        name.textContent = path;
        head.appendChild(name);
        host.insertBefore(head, host.firstChild);
      }
      var box = document.createElement("span");
      box.className = "srclinks";
      box.appendChild(makeLink(blobUrl(sha, path, s.a, s.b), lineRange("L", s.a, s.b),
        "These lines of " + path + " at " + sha.slice(0, 7) + " on GitHub"));
      head.appendChild(box);
      if (source.pr && changed[path]) {
        sha256(path).then(function (hex) {
          var url = repo + "/pull/" + source.pr + "/files#diff-" + hex + lineRange(s.base ? "L" : "R", s.a, s.b);
          box.appendChild(makeLink(url, "PR #" + source.pr, "These lines in the Files changed view of PR #" + source.pr));
        }).catch(function () {});
      }
    });
    document.querySelectorAll(".ln").forEach(function (ln) {
      var m = /^\s*L?(\d+)(?:\s*[-–]\s*L?(\d+))?\s*$/.exec(ln.textContent);
      if (!m || ln.querySelector("a")) return;
      var host = ln.closest("[data-path]");
      var list = ln.closest(".lbl");
      // The nearest earlier code block decides; one without data-path gives no link.
      for (var sib = list && list.previousElementSibling; sib && !host; sib = sib.previousElementSibling) {
        if (sib.hasAttribute("data-path")) host = sib;
        else if (sib.querySelector("pre")) break;
      }
      var sha = host && shaOf(host);
      if (!sha) return;
      var path = host.getAttribute("data-path");
      var a = parseInt(m[1], 10), b = m[2] ? parseInt(m[2], 10) : a;
      var text = ln.textContent;
      ln.textContent = "";
      ln.appendChild(makeLink(blobUrl(sha, path, a, b), text, "These lines of " + path + " at " + sha.slice(0, 7) + " on GitHub"));
    });
  }
  /* ---------- scrollspy ---------- */
  var links = Array.prototype.slice.call(document.querySelectorAll("#sidebar a[href^='#']"));
  var byId = {};
  links.forEach(function (a) { byId[a.getAttribute("href").slice(1)] = a; });
  var targets = links.map(function (a) { return document.getElementById(a.getAttribute("href").slice(1)); }).filter(Boolean);
  if ("IntersectionObserver" in window) {
    var spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          links.forEach(function (a) { a.classList.remove("active"); });
          var a = byId[en.target.id];
          if (a) a.classList.add("active");
        }
      });
    }, { rootMargin: "-10% 0px -80% 0px" });
    targets.forEach(function (t) { spy.observe(t); });
  }
  /* ---------- step walkers ---------- */
  document.querySelectorAll("[data-walker]").forEach(function (walker) {
    var steps = Array.prototype.slice.call(walker.querySelectorAll(".wstep"));
    var lines = Array.prototype.slice.call(walker.querySelectorAll(".cl[data-l]"));
    var prev = walker.querySelector("[data-wprev]");
    var next = walker.querySelector("[data-wnext]");
    var dotsBox = walker.querySelector(".wdots");
    var idx = 0;
    steps.forEach(function (_, i) {
      var d = document.createElement("i");
      if (i === 0) d.classList.add("on");
      dotsBox.appendChild(d);
    });
    var dots = Array.prototype.slice.call(dotsBox.children);
    function show(n) {
      idx = Math.max(0, Math.min(steps.length - 1, n));
      steps.forEach(function (s, i) { s.classList.toggle("on", i === idx); });
      dots.forEach(function (d, i) { d.classList.toggle("on", i === idx); });
      var want = {};
      (steps[idx].getAttribute("data-lines") || "").split(",").forEach(function (x) { if (x) want[x.trim()] = true; });
      lines.forEach(function (cl) { cl.classList.toggle("hl", !!want[cl.getAttribute("data-l")]); });
      // Scroll the code pane (never the page) so that the first highlighted line is visible.
      var pane = walker.querySelector(".wcode");
      var first = walker.querySelector(".cl.hl[data-l]");
      if (pane && first) {
        var top = first.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop;
        if (top < pane.scrollTop || top > pane.scrollTop + pane.clientHeight - 40) pane.scrollTop = Math.max(0, top - 40);
      }
      prev.disabled = idx === 0;
      next.disabled = idx === steps.length - 1;
    }
    prev.addEventListener("click", function () { show(idx - 1); });
    next.addEventListener("click", function () { show(idx + 1); });
    show(0);
  });
  /* ---------- chart walkers: each step highlights one state of a statechart ----------
     A step's data-node is the state's id in chart.mmd (s3, lg0). Mermaid draws that
     state as <g id="state-s3-N">. The diagram re-renders on a theme change, so the
     walker paints again on the "walkthrough:diagrams" event. */
  document.querySelectorAll("[data-chartwalk]").forEach(function (walker) {
    var steps = Array.prototype.slice.call(walker.querySelectorAll(".wstep"));
    var prev = walker.querySelector("[data-wprev]");
    var next = walker.querySelector("[data-wnext]");
    var dotsBox = walker.querySelector(".wdots");
    var idx = 0;
    steps.forEach(function () { dotsBox.appendChild(document.createElement("i")); });
    var dots = Array.prototype.slice.call(dotsBox.children);
    function nodeOf(svg, id) {
      return id ? svg.querySelector('g[id^="state-' + CSS.escape(id) + '-"]') : null;
    }
    function paint() {
      var svg = walker.querySelector(".mermaid svg");
      if (!svg) return;
      // Mermaid shrinks a diagram to fit its box, which makes a statechart in a
      // narrow pane unreadable. Keep its natural width; the pane scrolls instead.
      var natural = parseFloat(svg.style.maxWidth);
      if (natural) { svg.style.width = natural + "px"; svg.style.maxWidth = "none"; }
      svg.querySelectorAll(".cw-on, .cw-seen").forEach(function (g) { g.classList.remove("cw-on", "cw-seen"); });
      steps.slice(0, idx).forEach(function (s) {
        var g = nodeOf(svg, s.getAttribute("data-node"));
        if (g) g.classList.add("cw-seen");
      });
      var on = nodeOf(svg, steps[idx].getAttribute("data-node"));
      if (!on) return;
      on.classList.remove("cw-seen");
      on.classList.add("cw-on");
      // Scroll the chart pane (never the page) so that the state is visible.
      var pane = walker.querySelector(".wchart");
      if (pane) {
        var r = on.getBoundingClientRect(), b = pane.getBoundingClientRect();
        if (r.top < b.top || r.bottom > b.bottom) pane.scrollTop += r.top - b.top - (pane.clientHeight - r.height) / 2;
        if (r.left < b.left || r.right > b.right) pane.scrollLeft += r.left - b.left - (pane.clientWidth - r.width) / 2;
      }
    }
    function show(n) {
      idx = Math.max(0, Math.min(steps.length - 1, n));
      steps.forEach(function (s, i) { s.classList.toggle("on", i === idx); });
      dots.forEach(function (d, i) { d.classList.toggle("on", i === idx); });
      prev.disabled = idx === 0;
      next.disabled = idx === steps.length - 1;
      paint();
    }
    prev.addEventListener("click", function () { show(idx - 1); });
    next.addEventListener("click", function () { show(idx + 1); });
    document.addEventListener("walkthrough:diagrams", paint);
    var resized;
    window.addEventListener("resize", function () { clearTimeout(resized); resized = setTimeout(paint, 150); });
    show(0);
  });
  /* ---------- glossary jump on dfn click ---------- */
  var dts = Array.prototype.slice.call(document.querySelectorAll(".glos dt"));
  document.querySelectorAll("dfn").forEach(function (d) {
    d.addEventListener("click", function () {
      var term = d.textContent.trim().toLowerCase();
      var hit = dts.filter(function (dt) {
        var t = dt.textContent.trim().toLowerCase();
        return t === term || t.indexOf(term) === 0 || term.indexOf(t) === 0;
      })[0];
      var el = hit || document.querySelector(".glos");
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        if (hit) {
          hit.style.transition = "background .3s";
          hit.style.background = "var(--warn-bg)";
          setTimeout(function () { hit.style.background = "transparent"; }, 1400);
        }
      }
    });
  });
})();

<script type="module">
  /* Both CDN libraries are optional: without them code stays plain and diagrams
     fall back to their source text. */
  var root = document.documentElement;
  var HLJS = "https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/es";
  var MERMAID = "https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.esm.min.mjs";

  /* ---------- syntax highlighting ---------- */
  function langOf(el) {
    var m = /(?:^|\s)language-(\S+)/.exec(el.className);
    return m ? m[1].toLowerCase() : null;
  }
  // highlight.js output keeps a span open across a newline (a multi-line
  // string or comment). Close the open spans at each newline and reopen them
  // on the next line, so every line is balanced HTML.
  function splitLines(html) {
    var lines = [], open = [], cur = "";
    html.replace(/<span[^>]*>|<\/span>|\n|[^<\n]+/g, function (tok) {
      if (tok === "\n") {
        lines.push(cur + "</span>".repeat(open.length));
        cur = open.join("");
      } else if (tok === "</span>") {
        open.pop(); cur += tok;
      } else {
        if (tok.charAt(0) === "<") open.push(tok);
        cur += tok;
      }
      return "";
    });
    lines.push(cur);
    return lines;
  }
  async function highlightCode() {
    var blocks = Array.prototype.slice.call(
      document.querySelectorAll('pre > code[class*="language-"], .sig[class*="language-"]'));
    if (!blocks.length) return;
    var hljs = (await import(HLJS + "/highlight.min.js")).default;
    var missing = {};
    blocks.forEach(function (b) {
      var lang = langOf(b);
      if (lang && /^[a-z0-9-]+$/.test(lang) && !hljs.getLanguage(lang)) missing[lang] = true;
    });
    // Grammars outside the common bundle load on demand. An unknown name
    // fails here (a 404 in the console) and its blocks stay plain.
    await Promise.all(Object.keys(missing).map(function (lang) {
      return import(HLJS + "/languages/" + lang + ".min.js")
        .then(function (mod) { hljs.registerLanguage(lang, mod.default); })
        .catch(function () {});
    }));
    blocks.forEach(function (block) {
      var lang = langOf(block);
      if (!lang || !hljs.getLanguage(lang)) return;
      var lines = Array.prototype.slice.call(block.querySelectorAll(":scope > .cl"));
      var targets = lines.length ? lines : [block];
      // Elements inside a line mean the author marked it by hand: keep it.
      if (targets.some(function (t) { return t.children.length; })) return;
      var text = targets.map(function (t) { return t.textContent; }).join("\n");
      var out = splitLines(hljs.highlight(text, { language: lang, ignoreIllegals: true }).value);
      if (!lines.length) { block.innerHTML = out.join("\n"); return; }
      if (out.length !== lines.length) return;  // a .cl held a newline: leave the block plain
      lines.forEach(function (cl, i) { cl.innerHTML = out[i]; });
    });
  }
  highlightCode().catch(function () {});

  /* ---------- mermaid ---------- */
  var diagrams = Array.prototype.slice.call(document.querySelectorAll(".mermaid"));
  // A statechart's own classDef lines hard-code light colours with !important;
  // the page's CSS colours those classes in both themes instead.
  var MARK_STYLES = /^[ \t]*classDef[ \t]+(breaks|mayBreak)[ \t].*$\n?/gm;
  // Mermaid 10 keeps a label on one line, so a statechart with full labels gets
  // wide and shrinks to fit. Break each state and arrow label into lines of at
  // most WRAP characters, at spaces. The front matter (the title) stays as it is.
  var WRAP = 26;
  var FRONT_MATTER = /^\s*---\n[\s\S]*?\n---\n/;
  // innerHTML gives "-->" as "--&gt;".
  var LABEL = /^([ \t]*(?:\w+|(?:\[\*\]|\w+) --(?:>|&gt;) \w+): )(.+)$/gm;
  function wrapLabel(text) {
    var lines = [], line = "";
    text.split(" ").forEach(function (word) {
      if (line && (line + " " + word).length > WRAP) { lines.push(line); line = word; }
      else line = line ? line + " " + word : word;
    });
    lines.push(line);
    return lines.join("<br/>");
  }
  function statechartSource(src) {
    var text = src.replace(MARK_STYLES, "");
    var head = (text.match(FRONT_MATTER) || [""])[0];
    return head + text.slice(head.length).replace(LABEL, function (_, start, label) { return start + wrapLabel(label); });
  }
  var sources = diagrams.map(function (el) {
    return el.hasAttribute("data-statechart") ? statechartSource(el.innerHTML) : el.innerHTML;
  });
  function cssVar(name) { return getComputedStyle(root).getPropertyValue(name).trim(); }
  // The "base" theme is the only mermaid theme that takes themeVariables, and
  // it needs real colours, not var() references: read them from the page.
  function mermaidConfig() {
    var ink = cssVar("--ink");
    return {
      startOnLoad: false,
      theme: "base",
      themeVariables: {
        darkMode: root.getAttribute("data-theme") === "dark",
        fontFamily: getComputedStyle(document.body).fontFamily,
        background: cssVar("--diagram-bg"),
        primaryColor: cssVar("--diagram-node"),
        primaryTextColor: ink,
        primaryBorderColor: cssVar("--accent"),
        secondaryColor: cssVar("--diagram-alt"),
        tertiaryColor: cssVar("--diagram-alt"),
        lineColor: cssVar("--ink-2"),
        textColor: ink,
        edgeLabelBackground: cssVar("--diagram-bg"),
        clusterBkg: cssVar("--diagram-alt"),
        clusterBorder: cssVar("--line"),
        noteBkgColor: cssVar("--warn-bg"),
        noteTextColor: ink,
        noteBorderColor: cssVar("--warn-bar"),
        actorLineColor: cssVar("--ink-3"),
        attributeBackgroundColorOdd: cssVar("--panel"),
        attributeBackgroundColorEven: cssVar("--diagram-alt")
      },
      flowchart: { htmlLabels: true, curve: "basis" },
      sequence: { actorMargin: 60, messageMargin: 34 },
      er: { layoutDirection: "LR" }
    };
  }
  // Render off-screen, then swap each SVG in. The visible diagram never shows
  // its source mid-render, and diagrams in a hidden tab or a closed <details>
  // still get a real layout.
  async function renderDiagrams(mermaid) {
    mermaid.initialize(mermaidConfig());
    var stage = document.createElement("div");
    stage.setAttribute("aria-hidden", "true");
    stage.style.cssText = "position:absolute;left:-10000px;top:0;visibility:hidden;width:" +
      ((document.querySelector("main") || document.body).clientWidth || 1000) + "px";
    document.body.appendChild(stage);
    var clones = sources.map(function (src) {
      var c = document.createElement("div");
      c.className = "mermaid";
      c.innerHTML = src;
      stage.appendChild(c);
      return c;
    });
    try {
      await mermaid.run({ nodes: clones, suppressErrors: true });
      diagrams.forEach(function (el, i) {
        if (clones[i].querySelector("svg")) el.replaceChildren.apply(el, Array.prototype.slice.call(clones[i].childNodes));
      });
    } finally {
      stage.remove();
    }
    document.dispatchEvent(new Event("walkthrough:diagrams"));
  }
  function fallback() {
    diagrams.forEach(function (el) {
      var pre = document.createElement("pre");
      pre.className = "mermaid-fallback";
      pre.textContent = el.textContent;
      el.replaceWith(pre);
    });
  }
  if (diagrams.length) {
    try {
      var mermaid = (await import(MERMAID)).default;
      // One render at a time: a toggle during a render queues the next one.
      var queue = renderDiagrams(mermaid);
      document.addEventListener("walkthrough:theme", function () {
        queue = queue.catch(function () {}).then(function () { return renderDiagrams(mermaid); });
      });
      await queue;
    } catch (e) {
      fallback();
    }
  }
</script>
</body>
</html>
